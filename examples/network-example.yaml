apiVersion: v1
kind: Namespace
metadata:
  name: agents
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: teleport-only
  namespace: agents
spec:
  podSelector: {}            # every pod in the namespace
  policyTypes: [Ingress, Egress]   # no ingress rules: nothing in
  egress:
  - to:                      # DNS, to resolve the proxy
    - namespaceSelector: {}
      podSelector:
        matchLabels: {k8s-app: kube-dns}
    ports:
    - {port: 53, protocol: UDP}
    - {port: 53, protocol: TCP}
  - to:                      # the Teleport proxy, nothing else
    - ipBlock: {cidr: 44.198.252.22/32}
    - ipBlock: {cidr: 44.213.172.215/32}
    - ipBlock: {cidr: 44.217.250.22/32}
    ports:
    - {port: 443, protocol: TCP}
---

# An ordinary alpine container with a Teleport identity. Nothing in the image
# knows about Teleport: it reaches apps through tbot's proxy on loopback.
#
# TOKEN_NAME / REGISTRATION_SECRET: a fresh bound_keypair token (see README).
apiVersion: v1
kind: Pod
metadata:
  name: network-demo
  namespace: agents
  annotations:
    io.katacontainers.config.hypervisor.kernel_params: "tbot.token=TOKEN_NAME tbot.secret=REGISTRATION_SECRET tbot.app_proxy=8080"
spec:
  runtimeClassName: kata-identity
  containers:
    - name: agent
      image: pfcurtis/network-test:latest
      command:
        - sh
        - -c
        - |
          echo "tbot status:"; wget -qO- http://127.0.0.1:41950/readyz; echo
          echo "apps: http_proxy=http://127.0.0.1:8080 wget -qO- http://<app-name>/"
          exec sleep infinity
      resources:
        limits: { cpu: "1", memory: 256Mi }
