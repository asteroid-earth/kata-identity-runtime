# kata-deploy (>= 4.2.0) Helm values that add the "kata-identity" RuntimeClass.
# Merge into your existing kata-deploy release (helm upgrade ... --reuse-values -f this).
#
# Replace before use:
#   TELEPORT_PROXY  your Teleport Proxy, host:port (e.g. example.teleport.sh:443)
#   VERITY_PARAMS   contents of build/root_hash_identity-extension.txt
customRuntimes:
  enabled: true
  runtimes:
    identity:
      baseConfig: "qemu-runtime-rs"   # stock 4.x shim, amd64 and arm64
      dropIn: |
        [hypervisor.qemu]
        # Stock default params, plus the cluster-wide tbot setting. Per-pod values
        # (tbot.token, tbot.secret, listeners) come from the pod annotation
        # io.katacontainers.config.hypervisor.kernel_params, merged by key.
        kernel_params = "cgroup_no_v1=all systemd.unified_cgroup_hierarchy=1 tbot.proxy=TELEPORT_PROXY"
        # The prestart hook ships inside the extension.
        guest_hook_path = "/run/kata-extensions/identity/hooks"

        # The stock guest mounts this read-only at /run/kata-extensions/identity
        # before kata-agent starts, refusing it if dm-verity fails.
        [[hypervisor.qemu.guest_extension_images]]
        name = "identity"
        path = "/opt/kata-identity/kata-identity-extension.img"
        verity_params = "VERITY_PARAMS"
      runtimeClass: |
        kind: RuntimeClass
        apiVersion: node.k8s.io/v1
        metadata:
          name: kata-identity
          labels:
            app.kubernetes.io/managed-by: kata-deploy
        handler: kata-identity
        scheduling:
          nodeSelector:
            katacontainers.io/kata-runtime: "true"
      inheritBaseOverhead: true
