# What kata-identity workloads may reach. Grant the minimum: workloads only get
# loopback access to what this role allows, for the life of the pod.
kind: role
version: v7
metadata:
  name: kata-identity-agent
spec:
  allow:
    # HTTP apps (tbot.app_proxy / tbot.app.NAME). Label the apps you want
    # workloads to reach, or change this selector to match existing labels.
    app_labels:
      kata-identity: allowed
    # MCP servers aren't reachable through tbot's app proxy yet (README, Limits);
    # this grant only takes effect once they are.
    mcp:
      tools: ["*"]
    # Databases (tbot.db.SERVICE=PORT:USER:DB).
    db_labels:
      kata-identity: allowed
    db_users: ["readonly"]
    db_names: ["*"]
  options:
    max_session_ttl: 1h
